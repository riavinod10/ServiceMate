services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: servicemate, POSTGRES_USER: servicemate, POSTGRES_PASSWORD: servicemate }
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicemate -d servicemate"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment: { POSTGRES_DB: servicemate, POSTGRES_USER: servicemate, POSTGRES_PASSWORD: servicemate, POSTGRES_HOST: db }
    volumes: [".:/app"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment: { POSTGRES_DB: servicemate, POSTGRES_USER: servicemate, POSTGRES_PASSWORD: servicemate, POSTGRES_HOST: db, CELERY_BROKER_URL: redis://redis:6379/0, CELERY_RESULT_BACKEND: redis://redis:6379/0 }
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build: .
    command: celery -A servicemate worker -l info
    environment: { POSTGRES_DB: servicemate, POSTGRES_USER: servicemate, POSTGRES_PASSWORD: servicemate, POSTGRES_HOST: db, CELERY_BROKER_URL: redis://redis:6379/0, CELERY_RESULT_BACKEND: redis://redis:6379/0, APIFY_API_TOKEN: "${APIFY_API_TOKEN:-}", GEMINI_API_KEY: "${GEMINI_API_KEY:-}", GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}" }
    volumes: [".:/app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
