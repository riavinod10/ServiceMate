  <path d="M100 14 L22 44 L78 70 L18 92" fill="none" stroke="{{ colour|default:'#0048d6' }}" stroke-width="{{ stroke|default:14 }}" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
