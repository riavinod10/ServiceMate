<h1>Pending approvals</h1>{% for approval in approvals %}<section><p>{{ approval.request.raw_text }}</p><form method="post" action="{% url 'approval_action' approval.id %}">{% csrf_token %}<button name="action" value="approve">Approve</button><button name="action" value="reject">Reject</button><button name="action" value="search_again">Search again</button></form></section>{% empty %}<p>No pending approvals.</p>{% endfor %}
