{% load static %}<aside class="sm-auth__brand">
  <div class="sm-auth__shapes" aria-hidden="true">
    <span class="sm-shape sm-shape--pink-quarter"></span>
    <span class="sm-shape sm-shape--sun-dot"></span>
    <span class="sm-shape sm-shape--cream-pill"></span>
    <span class="sm-shape sm-shape--ring"></span>
  </div>
  <img class="sm-auth__logo" src="{% static 'core/img/servicemate-logo-cream.png' %}" alt="ServiceMate" width="104" height="48">
  <p class="sm-auth__sticker">Nothing gets booked until you approve it</p>
  <div class="sm-auth__pitch">
    <h1 class="sm-display">{{ headline }}</h1>
    <p>{{ pitch }}</p>
  </div>
  <div class="sm-auth__example">
    <small>Just tell it what you need:</small>
    <p>“AC not cooling, need someone tomorrow evening under ₹1,500”</p>
  </div>
</aside>
