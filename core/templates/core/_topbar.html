{% load static %}
<nav class="sm-nav" aria-label="Main navigation">
  <div class="sm-nav__inner">

    <a class="sm-nav__brand" href="{% url 'home' %}">
      <img src="{% static 'core/img/servicemate-logo-white.png' %}" alt="ServiceMate" height="32" width="auto">
    </a>

    <ul class="sm-nav__links" role="list">
      {% if user.is_authenticated %}
        <li><a href="{% url 'service_request_create' %}" class="sm-nav__link">New Request</a></li>
        <li><a href="{% url 'approvals' %}" class="sm-nav__link">Approvals</a></li>
        <li><a href="{% url 'my_services' %}" class="sm-nav__link">My Services</a></li>
      {% endif %}
    </ul>

    <div class="sm-nav__end">
      {% if user.is_authenticated %}
        <details class="sm-profile" data-sm-menu>
          <summary class="sm-profile__trigger" aria-label="Account menu">
            <span class="sm-profile__avatar" aria-hidden="true">{{ user.username|slice:":1"|upper }}</span>
            <span class="sm-profile__name">{{ user.username }}</span>
            <span class="sm-profile__caret" aria-hidden="true">▾</span>
          </summary>
          <ul class="sm-profile__menu" role="menu">
            <li role="menuitem">
              <a href="{% url 'settings' %}" class="sm-profile__item">Settings</a>
            </li>
            <li role="separator" aria-hidden="true"></li>
            <li role="menuitem">
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="sm-profile__item sm-profile__item--logout">Sign out</button>
              </form>
            </li>
          </ul>
        </details>
      {% else %}
        <a href="{% url 'login' %}" class="sm-btn sm-btn--secondary sm-btn--small">Sign in</a>
        <a href="{% url 'register' %}" class="sm-btn sm-btn--primary sm-btn--small">Register</a>
      {% endif %}
    </div>

  </div>
</nav>
