{% comment %}
  Comparison names each ranked provider `p`. A later include may pass `provider`.
  firstof keeps Choose from submitting an empty provider_id, which the approval view rejects.
{% endcomment %}
<form method="post" action="{% url 'approval_action' approval.id %}">
  {% csrf_token %}
  <input type="hidden" name="action" value="approve">
  <input type="hidden" name="provider_id" value="{% firstof p.place_id provider.place_id %}">
  <button type="submit" class="sm-btn {{ button_class|default:'sm-btn--primary' }}" name="action" value="approve">Choose this provider</button>
</form>
